<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-label="GabrielApplication terminal" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; font-size: 13px; fill: #e5e7eb; white-space: pre; }
    .t  { fill: #6b7280; }
    .i  { fill: #4ade80; }
    .w  { fill: #f5a623; font-weight: bold; }
    .c  { fill: #4a9eed; }
    .m  { fill: #e5e7eb; }
    .b  { fill: #ffffff; font-weight: bold; }
    .o  { fill: #e08a4b; }
    .g  { fill: #6aab73; }
    .y  { fill: #e6c34a; }
    .dim{ fill: #6b7280; }
    .l  { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .bar { fill: #4a9eed; transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .8s ease-out forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    .cur { animation: blink 1s steps(1) infinite; fill: #4ade80; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="918" height="638" rx="12" fill="#1e1f22" stroke="#3a3d42"/>
  <line x1="1" y1="44" x2="919" y2="44" stroke="#3a3d42"/>
  <polygon points="22,16 22,30 34,23" fill="#4ade80"/>
  <text x="46" y="28" class="b">Run: <tspan class="m">GabrielApplication</tspan></text>
  <text x="690" y="28" class="dim">java -jar gabriel-dev.jar</text>
  <rect x="884" y="17" width="12" height="12" rx="2" fill="#e5484d"/>

  <!-- banner -->
  <text x="38" y="133" style="font-size:84px;font-weight:900;letter-spacing:6px;fill:#2f5436">GABRIEL</text>
  <text x="32" y="127" style="font-size:84px;font-weight:900;letter-spacing:6px;fill:#6aab73">GABRIEL</text>
  <text x="560" y="150" class="dim">.dev</text>
  <text x="26" y="168" class="g">:: Gabriel ::   <tspan class="dim">developer · backend · cloud · test automation · clean code</tspan></text>

