    <text x="186" y="304" class="c">g.d.Data</text>
    <text x="366" y="304" class="m">: Data under control: relational <tspan class="b">PostgreSQL</tspan> + flexible <tspan class="b">MongoDB</tspan></text>
  </g>
  <g class="l" style="animation-delay:2.3s">
