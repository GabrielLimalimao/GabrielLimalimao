    <rect class="bar" x="648" y="470" width="36" height="50" rx="2" style="animation-delay:.4s"/>
    <rect class="bar" x="710" y="485" width="36" height="35" rx="2" style="animation-delay:.5s"/>
    <rect class="bar" x="772" y="470" width="36" height="50" rx="2" style="animation-delay:.6s"/>
    <rect class="bar" x="834" y="475" width="36" height="45" rx="2" style="animation-delay:.7s"/>
