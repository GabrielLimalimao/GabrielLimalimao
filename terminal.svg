    <text x="186" y="330" class="c">g.d.Pipeline</text>
    <text x="366" y="330" class="m">: Green pipeline: <tspan class="b">Git</tspan> → <tspan class="b">GitHub</tspan> → <tspan class="b">Actions</tspan> → deploy</text>
  </g>
  <g class="l" style="animation-delay:2.7s">
    <text x="24" y="356" class="t">08:17:01.959</text><text x="128" y="356" class="i">INFO</text>
    <text x="186" y="356" class="c">g.d.Infra</text>
    <text x="366" y="356" class="m">: Infra as code: <tspan class="b">AWS</tspan> + <tspan class="b">Terraform</tspan>, tested on <tspan class="b">LocalStack</tspan></text>
  </g>
  <g class="l" style="animation-delay:3.1s">
    <text x="24" y="382" class="t">08:17:02.096</text><text x="128" y="382" class="i">INFO</text>
