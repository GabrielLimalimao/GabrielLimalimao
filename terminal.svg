  <!-- ending -->
  <g class="l" style="animation-delay:4.6s">
    <text x="24" y="574" class="t">08:17:02.507</text><text x="128" y="574" class="i">INFO</text>
    <text x="186" y="574" class="c">g.d.GabrielApplication</text>
    <text x="366" y="574" class="m">: Tomcat on port 8080 · <tspan class="o">open to projects &amp; good ideas</tspan></text>
  </g>
  <g class="l" style="animation-delay:5s">
    <text x="24" y="600" class="t">08:17:02.644</text><text x="128" y="600" class="i">INFO</text>
