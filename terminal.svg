    <text x="366" y="382" class="m">: Test automation running → <tspan class="g">0 failures</tspan> (so far)</text>
  </g>
  <g class="l" style="animation-delay:3.5s">
    <text x="24" y="408" class="t">08:17:02.233</text><text x="128" y="408" class="w">WARN</text>
    <text x="186" y="408" class="c">g.d.Roadmap</text>
    <text x="366" y="408" class="y">: Fedora + Vim installing. Expect a few mistyped :wq.</text>
  </g>

  <!-- chart (sample values: edit the heights) -->
  <g class="l" style="animation-delay:3.9s">
